name: Eval

# Manual only: every run calls a paid or rate-limited LLM.
on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: >-
          Record apps/api/evals/baseline.json from this run instead of gating on it.
          Download the "eval-baseline" artifact afterwards and commit the file.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realestate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # No LLM secret or variable here: only the "Run the eval" step sees them, so
    # the install and download steps below run without any credentials.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestate
      # Required by the env schema; nothing is served in this job.
      ADMIN_TOKEN: eval-job-not-a-secret-0000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      # Pinned release, checked against the checksum published with it. Bump
      # OLLAMA_VERSION and OLLAMA_SHA256 together
      # (https://github.com/ollama/ollama/releases, file sha256sum.txt).
      - name: Install Ollama
        env:
          OLLAMA_VERSION: v0.40.2
          OLLAMA_SHA256: 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ollama.tar.zst" \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_SHA256}  $RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          sudo tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C /usr
          ollama --version
          (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Pull the embedding model
        run: ollama pull bge-m3

      - name: Index the sample listings
        run: pnpm seed

      - name: Run the eval
        env:
          # Repository variables fall back to the free Gemini setup when unset.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai-compatible' }}
          LLM_STRUCTURED_METHOD: ${{ vars.LLM_STRUCTURED_METHOD || 'functionCalling' }}
          OPENAI_COMPAT_BASE_URL: ${{ vars.OPENAI_COMPAT_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          OPENAI_COMPAT_MODEL: ${{ vars.OPENAI_COMPAT_MODEL || 'gemini-3.5-flash-lite' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          # Repository secrets. Set the one your provider needs.
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional tuning (blank means the default).
          EVAL_DELAY_MS: ${{ vars.EVAL_DELAY_MS }}
          EVAL_TOLERANCE: ${{ vars.EVAL_TOLERANCE }}
          EVAL_RETRY_WAIT_MS: ${{ vars.EVAL_RETRY_WAIT_MS }}
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
        run: |
          if [ "$UPDATE_BASELINE" = "true" ]; then
            pnpm eval --update-baseline
          else
            pnpm eval
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: apps/api/evals/results/latest.json
          if-no-files-found: ignore

      # Download this artifact and commit it as apps/api/evals/baseline.json.
      - name: Upload the new baseline
        if: ${{ inputs.update_baseline }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: apps/api/evals/baseline.json
          if-no-files-found: error
